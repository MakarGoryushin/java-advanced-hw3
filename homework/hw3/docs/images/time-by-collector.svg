<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
  <title id="title">Среднее время одной операции</title>
  <desc id="desc">Логарифмическая шкала времени в миллисекундах для G1, ZGC и Shenandoah.</desc>
  <rect width="900" height="510" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Среднее время операции, логарифмическая шкала</text>
  <text x="450" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">меньше — лучше; mixed/G1 содержит единичный выброс 104,198 ms/op</text>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="85" y1="410" x2="850" y2="410"/><line x1="85" y1="290" x2="850" y2="290"/>
    <line x1="85" y1="170" x2="850" y2="170"/><line x1="85" y1="50" x2="850" y2="50"/>
  </g>
  <g stroke="#111827" stroke-width="1.5"><line x1="85" y1="50" x2="85" y2="410"/><line x1="85" y1="410" x2="850" y2="410"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#111827">
    <text x="75" y="414" text-anchor="end">0.01</text><text x="75" y="294" text-anchor="end">0.1</text>
    <text x="75" y="174" text-anchor="end">1</text><text x="75" y="54" text-anchor="end">10 ms</text>
    <text x="160" y="438" text-anchor="middle">short-lived</text><text x="310" y="438" text-anchor="middle">long-lived</text>
    <text x="460" y="438" text-anchor="middle">mixed</text><text x="610" y="438" text-anchor="middle">large objects</text>
    <text x="760" y="438" text-anchor="middle">reference heavy</text>
  </g>
  <polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="160,164 310,366 460,47 610,235 760,59"/>
  <polyline fill="none" stroke="#d97706" stroke-width="2.5" points="160,198 310,367 460,242 610,231 760,81"/>
  <polyline fill="none" stroke="#059669" stroke-width="2.5" points="160,110 310,284 460,145 610,122 760,78"/>
  <g fill="#2563eb"><circle cx="160" cy="164" r="4"/><circle cx="310" cy="366" r="4"/><circle cx="460" cy="47" r="4"/><circle cx="610" cy="235" r="4"/><circle cx="760" cy="59" r="4"/></g>
  <g fill="#d97706"><circle cx="160" cy="198" r="4"/><circle cx="310" cy="367" r="4"/><circle cx="460" cy="242" r="4"/><circle cx="610" cy="231" r="4"/><circle cx="760" cy="81" r="4"/></g>
  <g fill="#059669"><circle cx="160" cy="110" r="4"/><circle cx="310" cy="284" r="4"/><circle cx="460" cy="145" r="4"/><circle cx="610" cy="122" r="4"/><circle cx="760" cy="78" r="4"/></g>
  <g font-family="Arial, sans-serif" font-size="13"><line x1="285" y1="475" x2="315" y2="475" stroke="#2563eb" stroke-width="3"/><text x="322" y="480">G1</text><line x1="405" y1="475" x2="435" y2="475" stroke="#d97706" stroke-width="3"/><text x="442" y="480">ZGC</text><line x1="535" y1="475" x2="565" y2="475" stroke="#059669" stroke-width="3"/><text x="572" y="480">Shenandoah</text></g>
</svg>
