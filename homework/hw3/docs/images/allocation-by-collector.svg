<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
  <title id="title">Выделения памяти на операцию</title>
  <desc id="desc">Байты на операцию для G1, ZGC и Shenandoah.</desc>
  <rect width="900" height="510" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Выделения памяти на операцию</text>
  <text x="450" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">gc.alloc.rate.norm; значения определяются главным образом самой нагрузкой</text>
  <g stroke="#d1d5db" stroke-width="1"><line x1="85" y1="410" x2="850" y2="410"/><line x1="85" y1="338" x2="850" y2="338"/><line x1="85" y1="266" x2="850" y2="266"/><line x1="85" y1="194" x2="850" y2="194"/><line x1="85" y1="122" x2="850" y2="122"/><line x1="85" y1="50" x2="850" y2="50"/></g>
  <g stroke="#111827" stroke-width="1.5"><line x1="85" y1="50" x2="85" y2="410"/><line x1="85" y1="410" x2="850" y2="410"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#111827"><text x="75" y="414" text-anchor="end">0</text><text x="75" y="342" text-anchor="end">2M</text><text x="75" y="270" text-anchor="end">4M</text><text x="75" y="198" text-anchor="end">6M</text><text x="75" y="126" text-anchor="end">8M</text><text x="75" y="54" text-anchor="end">10M B/op</text><text x="160" y="438" text-anchor="middle">short-lived</text><text x="310" y="438" text-anchor="middle">long-lived</text><text x="460" y="438" text-anchor="middle">mixed</text><text x="610" y="438" text-anchor="middle">large objects</text><text x="760" y="438" text-anchor="middle">reference heavy</text></g>
  <polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="160,64 310,395 460,237 610,184 760,276"/>
  <polyline fill="none" stroke="#d97706" stroke-width="2.5" points="160,64 310,395 460,237 610,184 760,260"/>
  <polyline fill="none" stroke="#059669" stroke-width="2.5" points="160,64 310,395 460,237 610,184 760,274"/>
  <g fill="#2563eb"><circle cx="160" cy="64" r="4"/><circle cx="310" cy="395" r="4"/><circle cx="460" cy="237" r="4"/><circle cx="610" cy="184" r="4"/><circle cx="760" cy="276" r="4"/></g>
  <g fill="#d97706"><circle cx="160" cy="64" r="4"/><circle cx="310" cy="395" r="4"/><circle cx="460" cy="237" r="4"/><circle cx="610" cy="184" r="4"/><circle cx="760" cy="260" r="4"/></g>
  <g fill="#059669"><circle cx="160" cy="64" r="4"/><circle cx="310" cy="395" r="4"/><circle cx="460" cy="237" r="4"/><circle cx="610" cy="184" r="4"/><circle cx="760" cy="274" r="4"/></g>
